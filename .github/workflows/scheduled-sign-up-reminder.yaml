name: "[Scheduled] Sign up Telegram reminder"

on:
  schedule:
    # Runs every Thursday at 09:00 UTC (10:00 CET / 11:00 CEST in Barcelona)
    - cron: "0 9 * * THU"
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Send to test chat instead of the prod group"
        type: boolean
        default: true

jobs:
  send_message:
    runs-on: ubuntu-latest

    steps:
      - name: Set Date and Time Variables
        run: |
          TARGET_DATE=$(TZ="Europe/Madrid" date -d "+12 days" +"%d/%m/%Y")
          TARGET_WEEKDAY=$(TZ="Europe/Madrid" date -d "+12 days" +"%A")
          echo "Target date: $TARGET_WEEKDAY $TARGET_DATE"
          echo "TARGET_DATE=$TARGET_DATE" >> "$GITHUB_ENV"
          echo "TARGET_WEEKDAY=$TARGET_WEEKDAY" >> "$GITHUB_ENV"

      - name: Send Telegram Reminder & Poll
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ (github.event_name == 'workflow_dispatch' && inputs.test_mode) && vars.TELEGRAM_TEST_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
          TARGET_DATE: ${{ env.TARGET_DATE }}
          TARGET_WEEKDAY: ${{ env.TARGET_WEEKDAY }}
        run: |
          python3 - << 'EOF'
          import json
          import os
          import urllib.request

          bot_token = os.environ["TELEGRAM_BOT_TOKEN"].strip()
          chat_id = os.environ["TELEGRAM_CHAT_ID"].strip()
          weekday = os.environ["TARGET_WEEKDAY"]
          date_str = os.environ["TARGET_DATE"]

          if not bot_token or not chat_id:
              raise ValueError("Missing TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID.")

          def post_telegram(method: str, payload: dict) -> None:
              data = json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  f"https://api.telegram.org/bot{bot_token}/{method}",
                  data=data,
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=15) as resp:
                  body = json.loads(resp.read().decode())
                  if not body.get("ok"):
                      raise RuntimeError(f"Telegram API error ({method}): {body}")

          text = (
              f"🎾 <b>Sign Up: Pádel for {weekday} {date_str}, 18:00-19:30 (2 Courts, 8 People)</b> 🎾\n"
              "━━━━━━━━━━━━━━━\n\n"
              "1️⃣ <b>Claim your spot</b> in the poll below (first 8 votes get priority).\n"
              "2️⃣ <b>Pay €12.00:</b> Sign in to the "
              '<a href="https://padel7santmarti.com/Login.aspx">Padel7 shared account</a> '
              'and recharge the wallet in <i>"Control de Saldo"</i>.\n'
              "3️⃣ <b>Confirm payment:</b> React with ✅ on this message (or reply) once you've paid.\n\n"
              "Based on the final headcount, we will adjust to 1 court if fewer than 8 sign up.\n\n"
          )

          post_telegram("sendMessage", {
              "chat_id": chat_id,
              "text": text,
              "parse_mode": "HTML",
              "disable_web_page_preview": True,
          })

          post_telegram("sendPoll", {
              "chat_id": chat_id,
              "question": f"🎾 Pádel {weekday} {date_str} (18:00-19:30) — Are you in?",
              "options": [
                  {"text": "✅ I'm in (€12)"},
                  {"text": "❌ Out this week"},
              ],
              "is_anonymous": False,
              "allows_multiple_answers": False,
          })

          print("Reminder message and sign-up poll sent successfully!")
          EOF
